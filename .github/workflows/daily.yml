name: trend-radar

on:
  schedule:
    - cron: "0 12 * * *"     # 每天 12:00 UTC = 北京 20:00 → collect
    - cron: "0 0 * * 1,3,5"  # 一三五 00:00 UTC = 北京 08:00 → digest
  workflow_dispatch:
    inputs:
      mode:
        description: "运行模式"
        type: choice
        options: [digest, collect]
        default: digest

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Determine mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 12 * * *" ]; then
            echo "mode=collect" >> "$GITHUB_OUTPUT"
          else
            echo "mode=digest" >> "$GITHUB_OUTPUT"
          fi

      - name: Run pipeline (${{ steps.mode.outputs.mode }})
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4o-mini' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          TRENDING_LANGUAGES: ${{ vars.TRENDING_LANGUAGES || ',python,typescript' }}
        run: |
          if [ "${{ steps.mode.outputs.mode }}" = "collect" ]; then
            python main.py --collect
          else
            python main.py
          fi

      - name: Persist history.db & archive
        run: |
          git config user.name "trend-radar-bot"
          git config user.email "actions@github.com"
          git pull --rebase origin main || true
          git add data/history.db docs/
          git diff --cached --quiet || git commit -m "chore: ${{ steps.mode.outputs.mode }} $(date -u +%F)"
          git push
